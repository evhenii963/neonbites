<main class="max-w-7xl mx-auto px-4 py-20 text-center">
    <div class="inline-flex items-center gap-2 bg-purple-950/50 border border-purple-800/30 px-4 py-1.5 rounded-full text-xs font-semibold text-fuchsia-400 mb-8 tracking-wide uppercase">
        ⚡️ Now Live in Austin, Texas
    </div>
    <h2 class="text-5xl md:text-8xl font-black tracking-tight mb-6 max-w-4xl mx-auto leading-none">Austin's Fastest <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">Food Delivery</span></h2>
    <p class="text-slate-400 text-base md:text-xl mb-12 max-w-xl mx-auto font-medium">Get your favorite meals from local restaurants delivered to your doorstep in 15 minutes or less.</p>
    
    <div class="bg-slate-900/90 p-2 rounded-2xl md:rounded-full border border-purple-500/20 max-w-2xl mx-auto flex flex-col md:flex-row items-center shadow-2xl gap-2 backdrop-blur-xl mb-32">
        <div class="flex items-center w-full pl-4 py-2">
            <span class="text-cyan-400 mr-2">📍</span>
            <input type="text" placeholder="Enter your delivery address in Austin..." class="bg-transparent w-full text-white outline-none placeholder-slate-500 text-sm md:text-base">
        </div>
        <button class="bg-cyan-400 hover:bg-cyan-500 text-slate-950 font-black px-10 py-4 rounded-xl md:rounded-full transition-all w-full md:w-auto shadow-lg shadow-cyan-400/20 text-sm md:text-base">Find Food</button>
    </div>

    <section id="driver-signup" class="border-t border-purple-950 pt-20 max-w-3xl mx-auto text-left">
        <div class="text-center mb-12">
            <h3 class="text-3xl md:text-4xl font-extrabold text-white mb-3">Drive and Earn with Us</h3>
            <p class="text-slate-400 text-sm md:text-base">Earn up to <span class="text-cyan-400 font-bold">$25/hour</span>. Flexible schedule. Instant payouts.</p>
        </div>
        <div class="bg-slate-900/40 p-6 md:p-10 rounded-3xl border border-purple-500/10 backdrop-blur-md">
            <form onsubmit="event.preventDefault(); alert('Application submitted successfully!');" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" required placeholder="John Doe" class="w-full bg-slate-950/80 p-4 rounded-xl border border-purple-900/50 outline-none text-white text-sm">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                        <input type="email" required placeholder="john@example.com" class="w-full bg-slate-950/80 p-4 rounded-xl border border-purple-900/50 outline-none text-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Vehicle Type</label>
                        <select class="w-full bg-slate-950/80 p-4 rounded-xl border border-purple-900/50 outline-none text-white text-sm">
                            <option>Car (Sedan / SUV)</option>
                            <option>Scooter / Motorcycle</option>
                            <option>E-Bike / Bicycle</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Texas Driver's License Number</label>
                    <input type="text" required placeholder="TX-998234" class="w-full bg-slate-950/80 p-4 rounded-xl border border-purple-900/50 outline-none text-white text-sm">
                </div>
                <button type="submit" class="w-full bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg text-sm md:text-base mt-2">Submit Application</button>
            </form>
        </div>
    </section>
</main>
